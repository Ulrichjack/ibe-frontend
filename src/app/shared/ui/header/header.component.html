<!-- Barre fixe. Au scroll, elle se compacte et pose un filet plutôt qu'une ombre. -->
<header class="fixed top-0 w-full z-50 bg-white transition-all duration-300"
        [class]="isScrolled()
          ? 'fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-ibe-200 transition-all duration-300'
          : 'fixed top-0 w-full z-50 bg-white border-b border-transparent transition-all duration-300'">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center gap-6 h-16 md:h-20">

      <!-- Marque -->
      <a routerLink="/" (click)="closeMenu()" class="flex items-center gap-3 shrink-0 group no-underline">
        <img src="assets/img/logo-ibe.webp"
               srcset="assets/img/logo-ibe-mobile-F64148E5.webp 96w, assets/img/logo-ibe.webp 150w"
               sizes="(min-width: 769px) 150px, 48px" alt="" width="44" height="44" aria-hidden="true"
             class="w-11 h-11 rounded-full object-cover">
        <span class="flex flex-col leading-none">
          <span class="font-serif text-2xl md:text-[1.75rem] text-ibe-dark group-hover:text-ibe-600 transition-colors">
            Beauty's Empire
          </span>
          <span class="text-[9px] uppercase tracking-[0.22em] text-ibe-muted mt-1">
            Institut · Yaoundé
          </span>
        </span>
      </a>

      <!-- Navigation desktop.
           Le repère de page active reprend la forme du pavé de nuancier. -->
      <nav class="hidden lg:flex items-center gap-8">
        <a routerLink="/" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="text-ibe-700 after:scale-x-100"
           class="relative text-[15px] font-medium text-ibe-muted hover:text-ibe-700 transition-colors py-2 no-underline
                  after:content-[''] after:absolute after:-bottom-0.5 after:left-0 after:h-[3px] after:w-6 after:rounded-full
                  after:bg-ibe-500 after:scale-x-0 after:origin-left after:transition-transform after:duration-300
                  hover:after:scale-x-100">Accueil</a>

        <a routerLink="/formations" routerLinkActive="text-ibe-700 after:scale-x-100"
           class="relative text-[15px] font-medium text-ibe-muted hover:text-ibe-700 transition-colors py-2 no-underline
                  after:content-[''] after:absolute after:-bottom-0.5 after:left-0 after:h-[3px] after:w-6 after:rounded-full
                  after:bg-ibe-500 after:scale-x-0 after:origin-left after:transition-transform after:duration-300
                  hover:after:scale-x-100">Formations</a>

        <a routerLink="/galerie" routerLinkActive="text-ibe-700 after:scale-x-100"
           class="relative text-[15px] font-medium text-ibe-muted hover:text-ibe-700 transition-colors py-2 no-underline
                  after:content-[''] after:absolute after:-bottom-0.5 after:left-0 after:h-[3px] after:w-6 after:rounded-full
                  after:bg-ibe-500 after:scale-x-0 after:origin-left after:transition-transform after:duration-300
                  hover:after:scale-x-100">Galerie</a>

        <a routerLink="/a-propos" routerLinkActive="text-ibe-700 after:scale-x-100"
           class="relative text-[15px] font-medium text-ibe-muted hover:text-ibe-700 transition-colors py-2 no-underline
                  after:content-[''] after:absolute after:-bottom-0.5 after:left-0 after:h-[3px] after:w-6 after:rounded-full
                  after:bg-ibe-500 after:scale-x-0 after:origin-left after:transition-transform after:duration-300
                  hover:after:scale-x-100">À propos</a>

        <a routerLink="/localisation" routerLinkActive="text-ibe-700 after:scale-x-100"
           class="relative text-[15px] font-medium text-ibe-muted hover:text-ibe-700 transition-colors py-2 no-underline
                  after:content-[''] after:absolute after:-bottom-0.5 after:left-0 after:h-[3px] after:w-6 after:rounded-full
                  after:bg-ibe-500 after:scale-x-0 after:origin-left after:transition-transform after:duration-300
                  hover:after:scale-x-100">Localisation</a>

        <a routerLink="/faq" routerLinkActive="text-ibe-700 after:scale-x-100"
           class="relative text-[15px] font-medium text-ibe-muted hover:text-ibe-700 transition-colors py-2 no-underline
                  after:content-[''] after:absolute after:-bottom-0.5 after:left-0 after:h-[3px] after:w-6 after:rounded-full
                  after:bg-ibe-500 after:scale-x-0 after:origin-left after:transition-transform after:duration-300
                  hover:after:scale-x-100">FAQ</a>
      </nav>

      <div class="hidden lg:flex shrink-0">
        <button (click)="openContactModal()" class="btn-primary">Nous contacter</button>
      </div>

      <button class="lg:hidden w-12 h-12 -mr-2 flex items-center justify-center text-ibe-dark"
              (click)="toggleMenu()"
              [attr.aria-expanded]="isMenuOpen()"
              [attr.aria-label]="isMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'">
        @if (isMenuOpen()) { <svg lucideX [size]="26"></svg> }
        @else { <svg lucideMenu [size]="26"></svg> }
      </button>
    </div>
  </div>

  <!-- Menu mobile -->
  @if (isMenuOpen()) {
    <div class="lg:hidden absolute top-full left-0 w-full bg-white border-b border-ibe-200 shadow-xl
                max-h-[calc(100vh-4rem)] overflow-y-auto">
      <nav class="flex flex-col py-2">
        <a routerLink="/" [routerLinkActiveOptions]="{exact: true}"
           routerLinkActive="bg-ibe-50 text-ibe-700 border-ibe-500"
           (click)="closeMenu()"
           class="px-6 py-4 text-lg text-ibe-dark border-l-[3px] border-transparent transition-colors no-underline">Accueil</a>
        <a routerLink="/formations" routerLinkActive="bg-ibe-50 text-ibe-700 border-ibe-500" (click)="closeMenu()"
           class="px-6 py-4 text-lg text-ibe-dark border-l-[3px] border-transparent transition-colors no-underline">Formations</a>
        <a routerLink="/galerie" routerLinkActive="bg-ibe-50 text-ibe-700 border-ibe-500" (click)="closeMenu()"
           class="px-6 py-4 text-lg text-ibe-dark border-l-[3px] border-transparent transition-colors no-underline">Galerie</a>
        <a routerLink="/a-propos" routerLinkActive="bg-ibe-50 text-ibe-700 border-ibe-500" (click)="closeMenu()"
           class="px-6 py-4 text-lg text-ibe-dark border-l-[3px] border-transparent transition-colors no-underline">À propos</a>
        <a routerLink="/localisation" routerLinkActive="bg-ibe-50 text-ibe-700 border-ibe-500" (click)="closeMenu()"
           class="px-6 py-4 text-lg text-ibe-dark border-l-[3px] border-transparent transition-colors no-underline">Localisation</a>
        <a routerLink="/faq" routerLinkActive="bg-ibe-50 text-ibe-700 border-ibe-500" (click)="closeMenu()"
           class="px-6 py-4 text-lg text-ibe-dark border-l-[3px] border-transparent transition-colors no-underline">FAQ</a>

        <div class="px-6 py-5">
          <button (click)="openContactModal(); closeMenu()" class="btn-primary w-full">Nous contacter</button>
        </div>
      </nav>
    </div>
  }
</header>

@defer (when showContactModal()) {
  @if (showContactModal()) {
    <app-contact-modal (close)="showContactModal.set(false)" />
  }
}
