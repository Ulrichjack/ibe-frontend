# Les fichiers Angular empreintés changent d'URL à chaque build.
map $uri $ibe_cache_control {
    default "no-cache";
    "~-[A-Z0-9]{8,}\.(js|css|woff2?)$" "public, max-age=31536000, immutable";
    "~*\.(webp|png|jpe?g|svg|ico|woff2?)$" "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $ibe_cache_control;

    # Un fichier absent doit renvoyer 404, jamais le HTML de l'application.
    location ~* \.(js|css|woff2?|webp|png|jpe?g|svg|ico|json|txt|xml)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
